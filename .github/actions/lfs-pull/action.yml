name: Pull LFS objects
description: Pull Git LFS objects, cached between runs to save the GitHub LFS bandwidth quota
runs:
  using: composite
  steps:
    - name: List LFS objects
      shell: sh
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

    # Any older cache helps (only the changed objects are downloaded), but only main saves one:
    # a pull request's cache can't be used by other branches and would only crowd out main's
    - name: Restore LFS objects
      id: lfs-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-assets-id') }}
        restore-keys: lfs-

    - name: Pull LFS objects
      shell: sh
      run: git lfs pull

    # Without the objects only older commits used, each saved cache stays the size of one checkout
    - name: Prune LFS objects
      if: github.ref == 'refs/heads/main' && steps.lfs-cache.outputs.cache-hit != 'true'
      shell: sh
      run: git lfs prune

    - name: Save LFS objects
      if: github.ref == 'refs/heads/main' && steps.lfs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-assets-id') }}
