name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Started by the godot-ai-plugin workflow after it commits to Renovate's branch
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-gdscript:
    name: Lint GDScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: tools/lint.sh gdscript

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: tools/lint.sh python

  # The tests in shares on parallel runners (balanced by tests/timings.txt), four processes each
  test-shard:
    name: Test ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull LFS objects
        uses: ./.github/actions/lfs-pull

      - name: Setup Godot
        uses: ./.github/actions/setup-godot

      - name: Import and run tests
        run: tools/test.sh
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
          TEST_REPORTS: test-reports

      # The scripts' durations, for tools/timings.sh
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.shard }}
          path: test-reports/
          retention-days: 30

  # The required status check: passes only when every share passed
  test:
    name: Test
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the shards
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: test "$RESULT" = success
