name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: tools/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # LFS objects are cached between runs to save the GitHub LFS bandwidth quota
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull

      - name: Read Godot version
        id: godot
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: godot-cache
        with:
          path: ~/godot
          key: godot-${{ steps.godot.outputs.version }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GODOT_VERSION: ${{ steps.godot.outputs.version }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot

      - name: Import and run tests
        env:
          GODOT_VERSION: ${{ steps.godot.outputs.version }}
        run: |
          export GODOT4_EDITOR="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          tools/test.sh
