# ruff config for the Python scripts (Blender asset scripts in assets/*/source/, tools/blender/; the
# sound synthesis in assets/audio/source/; the concept image tools in tools/concepts/):
# ruff's default rules, only overrides here. Files ignored by git (tmp/, local/, .venv/) are skipped.
extend-exclude = ["addons"]
# Wider than gdformat's 100: the asset scripts are full of coordinate and color tables
line-length = 120
# Blender's bundled Python, which runs every script here
target-version = "py313"

[lint]
ignore = [
  # dict(a=1) reads like the bpy keyword-argument calls around it
  "C408",
  # zip(..., strict=True) would raise where it silently stopped at the shortest before; the scripts
  # have no tests, and a changed bake result would only show in the re-baked assets
  "B905",
]

[lint.isort]
# The shared helpers in tools/blender/ (and tools/greybox.py for the greybox builders), the ore kit's geometry module and
# the nest's build (the quest nest builds on it), put on sys.path by the
# scripts that import them; the sound recipes next to assets/audio/source/build.py; the concept
# tools in tools/concepts/ (batches, db, gen)
known-first-party = ["bake", "batches", "common", "creature", "db", "dressing", "gen", "generated", "greybox", "humanoid", "key_poses", "fidgets", "nest_build", "ore_geo", "people", "synth", "aliens", "mining", "mission", "player", "refinery", "stations", "weapons"]
