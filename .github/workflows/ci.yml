name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-gdscript:
    name: Lint GDScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: tools/lint.sh gdscript

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: tools/lint.sh python

  # The tests in shares on parallel runners (balanced by tests/timings.txt), four processes each
  test-shard:
    name: Test ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull LFS objects
        uses: ./.github/actions/lfs-pull

      - name: Setup Godot
        uses: ./.github/actions/setup-godot

      - name: Import and run tests
        run: tools/test.sh
        env:
          TEST_SHARD: ${{ matrix.shard }}/4

  # The required status check: passes only when every share passed
  test:
    name: Test
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the shards
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: test "$RESULT" = success
